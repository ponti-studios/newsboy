name: newsboy - prompt eval

on:
  workflow_dispatch:
    inputs:
      baseline_prompt_file:
        description: "Prompt file for the existing (conceptual-match) strategy"
        required: false
        default: src/prompts/game-generation.md
        type: string
      literal_prompt_file:
        description: "Prompt file for the literal-match strategy"
        required: false
        default: src/prompts/game-generation-literal.md
        type: string
      model:
        description: "Optional model override (defaults to the script's configured model)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: realitea-production
    permissions:
      contents: read
      packages: read
    services:
      postgres-test:
        image: ghcr.io/ponti-studios/foundation/postgres:1.0.5
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hominem-test
        ports:
          - 4433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:4433/hominem-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Migrate test database
        run: pnpm db:migrate:test

      - name: Run baseline prompt (conceptual match)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASELINE_PROMPT_FILE: ${{ inputs.baseline_prompt_file }}
          EVAL_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          ARGS=(--prompt-file "$BASELINE_PROMPT_FILE")
          if [ -n "$EVAL_MODEL" ]; then
            ARGS+=(--model "$EVAL_MODEL")
          fi
          pnpm newsboy:prompt-test "${ARGS[@]}"

      - name: Run literal-match prompt
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LITERAL_PROMPT_FILE: ${{ inputs.literal_prompt_file }}
          EVAL_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          ARGS=(--prompt-file "$LITERAL_PROMPT_FILE" --literal)
          if [ -n "$EVAL_MODEL" ]; then
            ARGS+=(--model "$EVAL_MODEL")
          fi
          pnpm newsboy:prompt-test "${ARGS[@]}"
