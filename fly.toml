app = "newsboy"
primary_region = "sjc"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEWSBOY_APP_URL = "https://newsboy.ponti.io"
  HOMINEM_API_URL = "https://api.ponti.io"
  HOMINEM_INTERNAL_API_URL = "http://hominem-api.internal:4040"

[build.args]
  NEWSBOY_APP_URL = "https://newsboy.ponti.io"

[deploy]
  release_command = "node scripts/check-production-migration.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
